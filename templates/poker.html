<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>斗地主{{if .RoomName}} - {{.RoomName}}{{end}}</title>
<link rel="stylesheet" href="/static/css/app.css?v=20261127-icons3"/>
</head>
<body>
<nav id="game-bar" class="game-bar" hidden>
    <a id="back-to-rooms" class="back-link" href="/room/list"><img class="icon" src="/static/i/icons/back.png" alt=""/>房间列表</a>
    <a id="shop-link" class="back-link shop-link" href="/shop" target="_blank"><img class="icon" src="/static/i/icons/shop.png" alt=""/>外观商店</a>
</nav>
<div id="game"></div>
<div id="orientation"></div>
<input id="user" type="hidden" value="{{.User}}"/>

<main id="auth-panel" aria-label="登录或注册" {{if .LoggedIn}}hidden{{end}}>
    <section class="auth-card">
        <h1>斗地主</h1>
        <p>登录后开始游戏</p>
        <form id="auth-form">
            <label for="auth-username">用户名</label>
            <input id="auth-username" name="username" type="text" autocomplete="username" required maxlength="32"/>
            <label for="auth-password">密码</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required/>
            <div id="auth-confirm-row" hidden>
                <label for="auth-password-again">再次输入密码</label>
                <input id="auth-password-again" type="password" autocomplete="new-password"/>
            </div>
            <p id="auth-error" role="status" aria-live="polite"></p>
            <button id="auth-submit" type="submit">登录</button>
        </form>
        <button id="auth-toggle" type="button">没有账号？立即注册</button>
    </section>
</main>

<script type="text/javascript" src="/static/js/phaser.min.js"></script>
<script type="text/javascript" src="/static/js/boot.js?v=20261127-icons"></script>
<script type="text/javascript" src="/static/js/game.js?v=20261127-icons3"></script>
<script type="text/javascript" src="/static/js/rule.js?v=20261126-routes4"></script>
<script type="text/javascript" src="/static/js/player.js?v=20261127-icons"></script>
<script type="text/javascript" src="/static/js/player_net.js?v=20261124-round-reset"></script>
<script type="text/javascript" src="/static/js/net.js?v=20261126-routes4"></script>
<script type="text/javascript" src="/static/js/auth.js?v=20261126-routes4"></script>
<script>
(function () {
    var user = JSON.parse(document.getElementById("user").value);
    if (!user.uid) {
        //未登录：先登录，成功后重新加载当前牌桌页
        PGAuth.bindForm();
        return;
    }
    document.getElementById("auth-panel").hidden = true;
    document.getElementById("game-bar").hidden = false;
    PG.playerInfo = user;
    PG.roomId = user.room_id;

    //顶部导航条不压在牌桌上，画布按剩余高度等比缩放
    var barH = document.getElementById("game-bar").offsetHeight || 0;
    var h = (window.innerHeight - barH) * 960 / window.innerWidth;
    if (h > 540) h = 540;
    var game = new Phaser.Game(960, h, Phaser.AUTO, 'game');
    game.state.add('Boot', PG.Boot);
    game.state.add('Preloader', PG.Preloader);
    game.state.add('Game', PG.Game);
    game.state.start('Boot');
})();
</script>
</body>
</html>
